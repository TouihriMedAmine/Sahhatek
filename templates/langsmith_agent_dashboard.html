{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent {{ agent_name }} – LangSmith Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/langsmith-dashboard-improved.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .medical-primary { color: #d80027; }
    .bg-medical-primary { background-color: #d80027; }
    .border-medical-primary { border-color: #d80027; }
    .glow-medical { box-shadow: 0 0 20px rgba(216, 0, 39, 0.15); }
    
    /* Force light background - highest priority */
    html, body {
      background: #f8f9fa !important;
      background-color: #f8f9fa !important;
      background-image: none !important;
    }
    body * {
      background-image: none !important;
    }
    body[style*="gradient"], body[style*="linear-gradient"] {
      background: #f8f9fa !important;
      background-color: #f8f9fa !important;
    }
    
    /* Force dark text on all text elements */
    h1, h2, h3, h4, h5, h6, p, span, div, td, th, label {
      color: #0f172a !important;
    }
    .panel-title, .panel-title * {
      color: #0f172a !important;
      font-weight: 700 !important;
    }
    .card .label {
      color: #0f172a !important;
      font-weight: 700 !important;
    }
    table thead th {
      color: #0f172a !important;
      font-weight: 700 !important;
    }
    table tbody td {
      color: #0f172a !important;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900" data-agent="{{ agent_name }}" style="font-family: 'Open Sans', sans-serif; background: #f8f9fa !important;">
  <nav class="w-full border-b border-gray-200 px-6 py-4 flex items-center justify-between bg-white shadow-sm">
    <div class="flex items-center gap-4">
      <a href="{% url 'langsmith_dashboard' %}" class="text-medical-primary hover:text-medical-dark font-semibold">← Back</a>
      <div class="flex items-center gap-2">
        <span class="text-2xl">🤖</span>
        <div>
          <h1 class="text-2xl font-bold medical-primary">{{ agent_name }}</h1>
          <p class="text-xs text-gray-500">Administration Dashboard</p>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <select id="timeRangeSelect" class="bg-white border-2 border-gray-200 rounded-lg px-3 py-2 text-sm focus:border-medical-primary focus:ring-1 focus:ring-medical-primary text-gray-900">
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
      </select>
      <button id="refreshBtn" class="px-4 py-2 bg-gray-900 text-white rounded-lg font-semibold hover:bg-gray-800 transition-all shadow-sm">🔄 Refresh</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6 space-y-6" style="background: transparent !important;">
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="card glow-medical">
        <div class="label">🎯 Agent</div>
        <div id="kpiAgent" class="value text-base">{{ agent_name }}</div>
      </div>
      <div class="card glow-medical">
        <div class="label">📊 Executions</div>
        <div id="kpiAgentRuns" class="value">-</div>
      </div>
      <div class="card glow-medical">
        <div class="label">❌ Errors</div>
        <div id="kpiAgentErrors" class="value" style="color: #ef4444">-</div>
      </div>
      <div class="card glow-medical">
        <div class="label">⏱️ Avg. Latency</div>
        <div id="kpiAgentLatency" class="value text-base" style="color: #f59e0b">-</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">⏱️ Latency Distribution (Recent Executions)</div>
      <canvas id="agentLatencyChart" height="180"></canvas>
    </section>

    <section class="grid grid-cols-1 xl:grid-cols-2 gap-6">
      <div class="panel">
        <div class="panel-title flex items-center justify-between">
          <span>Agent Runs</span>
          <div class="flex items-center gap-2">
            <input id="searchInput" type="text" placeholder="Search input/output" class="bg-white border-2 border-gray-200 rounded-lg px-2 py-1 text-xs focus:border-medical-primary focus:ring-1 focus:ring-medical-primary text-gray-900" />
            <select id="statusSelect" class="bg-white border-2 border-gray-200 rounded-lg px-2 py-1 text-xs focus:border-medical-primary focus:ring-1 focus:ring-medical-primary text-gray-900">
              <option value="">All</option>
              <option value="success">Success</option>
              <option value="error">Errors</option>
            </select>
          </div>
        </div>
        <div class="overflow-auto">
          <table class="w-full text-sm">
            <thead>
              <tr>
                <th class="text-left p-2" style="color: #0f172a !important; font-weight: 700 !important;">Name</th>
                <th class="text-right p-2" style="color: #0f172a !important; font-weight: 700 !important;">Latency</th>
                <th class="text-right p-2" style="color: #0f172a !important; font-weight: 700 !important;">Tokens</th>
                <th class="text-right p-2" style="color: #0f172a !important; font-weight: 700 !important;">End Time</th>
              </tr>
            </thead>
            <tbody id="runsTable"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Run Details</div>
        <div id="runDetail" class="text-sm space-y-3"></div>
      </div>
    </section>
  </main>

  <script>
    window.__AGENT__ = "{{ agent_name }}";
  </script>
  <script src="{% static 'js/langsmith-dashboard-improved.js' %}"></script>
</body>
</html>
