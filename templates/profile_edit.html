<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white">
  <div class="max-w-3xl mx-auto px-6 py-10">

    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
        Edit Health Profile
      </h1>

      <div class="flex gap-2">
        <a href="/auth/dashboard/" class="px-4 py-2 rounded-xl bg-gray-800 border border-gray-700 hover:bg-gray-700">
          ← Dashboard
        </a>
      </div>
    </div>

    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <div class="p-5 rounded-2xl bg-gray-900 border border-gray-800">
        <label class="block text-sm text-gray-300 mb-2">Gender</label>
        <select name="gender" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800 outline-none">
          <option value="" {% if not profile.gender %}selected{% endif %}>—</option>
          <option value="male" {% if profile.gender == "male" %}selected{% endif %}>Male</option>
          <option value="female" {% if profile.gender == "female" %}selected{% endif %}>Female</option>
          <option value="other" {% if profile.gender == "other" %}selected{% endif %}>Other</option>
          <option value="prefer_not_to_say" {% if profile.gender == "prefer_not_to_say" %}selected{% endif %}>
            Prefer not to say
          </option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="p-5 rounded-2xl bg-gray-900 border border-gray-800">
          <label class="block text-sm text-gray-300 mb-2">Age</label>
          <input type="number" name="age" min="0" max="120"
                 value="{{ profile.age|default:'' }}"
                 class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800 outline-none" />
        </div>

        <div class="p-5 rounded-2xl bg-gray-900 border border-gray-800">
          <label class="block text-sm text-gray-300 mb-2">Blood Type</label>
          <select name="blood_type" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800 outline-none">
            <option value="" {% if not profile.blood_type %}selected{% endif %}>—</option>
            {% for b in blood_choices %}
              <option value="{{ b }}" {% if profile.blood_type == b %}selected{% endif %}>{{ b }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="p-5 rounded-2xl bg-gray-900 border border-gray-800">
        <label class="block text-sm text-gray-300 mb-2">Chronic Diseases</label>
        <p class="text-xs text-gray-500 mb-2">Comma-separated (e.g. diabetes, asthma)</p>
        <input type="text" name="chronic_diseases"
               value="{{ profile.chronic_diseases|join:', ' }}"
               class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800 outline-none" />
      </div>

      <div class="p-5 rounded-2xl bg-gray-900 border border-gray-800">
        <label class="block text-sm text-gray-300 mb-2">Allergies</label>
        <p class="text-xs text-gray-500 mb-2">Comma-separated (e.g. peanuts, penicillin)</p>
        <input type="text" name="allergies"
               value="{{ profile.allergies|join:', ' }}"
               class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800 outline-none" />
      </div>

      <div class="p-5 rounded-2xl bg-gray-900 border border-gray-800">
        <label class="block text-sm text-gray-300 mb-2">Medications</label>
        <p class="text-xs text-gray-500 mb-2">Comma-separated (e.g. metformin, ibuprofen)</p>
        <input type="text" name="medications"
               value="{{ profile.medications|join:', ' }}"
               class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800 outline-none" />
      </div>

      <button type="submit"
              class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90">
        Save Profile
      </button>
    </form>

  </div>
</body>
</html>
